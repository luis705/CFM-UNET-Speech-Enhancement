# ──────────────────────────────────────────────
# CFM-SE  -  Conditional Flow Matching for Speech Enhancement
# Split-band architecture operating directly in STFT domain.
# Pipeline: Audio → STFT → VelocityNet → iSTFT → Audio
# ──────────────────────────────────────────────

# ── Audio / STFT ─────────────────────────────
audio:
  sample_rate: 16000
  n_fft: 512
  hop_length: 128
  win_length: 512
  window: hann

# ── Data ─────────────────────────────────────
data:
  hf_dataset: JacobLinCool/VoiceBank-DEMAND-16k
  hf_cache_dir: data
  hf_trust_remote_code: false
  clean_column: clean
  noisy_column: noisy
  filename_column: id
  train_split: train
  val_split: null
  test_split: test
  val_ratio: 0.1
  val_split_from_test: 0.2
  segment_length: 32000                             # ~2 s at 16 kHz
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  batch_size: 12
  persistent_workers: true

# ── Model ────────────────────────────────────
model:
  save_onnx: false
  gradient_checkpointing: false
  velocity_net:
    hidden_dim: 64                                   # Channel width inside the network
    f_split: 128                                     # Freq bin boundary: low = 0..127, high = 128..256
    time_emb_dim: 128                                # Sinusoidal time embedding dimension
    low_band:
      num_layers: 4                                  # Self-attention Transformer blocks
      num_heads: 4
      ff_mult: 4                                     # FFN hidden = hidden_dim x ff_mult
      dropout: 0.1
    high_band:
      num_layers: 4                                  # Dilated CNN residual blocks
      dilations: [1, 2, 4, 8]
      dropout: 0.1
    bottleneck:
      num_heads: 4                                   # Cross-attention heads
      dropout: 0.1
    decoder:
      num_layers: 2                                  # Shallow CNN decoder layers

# ── ODE Solver ───────────────────────────────
ode:
  val:
    solver: euler                                    # Validation solver
    num_steps: 10                                    # Euler steps for validation
    atol: 1.0e-5
    rtol: 1.0e-5
  test:
    solver: dopri5                                   # Test solver (parametrizable via CLI)
    num_steps: 50                                    # Test steps (parametrizable via CLI)
    atol: 1.0e-5
    rtol: 1.0e-5

# ── Loss weights (sigmoid warmup + curriculum) ──
loss:
  curriculum_cfm_only_epochs: 10                     # Garante que as primeiras 10 épocas sejam 100% livres de instabilidade
  temporal_decay_gamma: 5.0                          # Aumentado de 3.0 para 5.0 (Crucial: a loss auxiliar será quase zero se t < 0.8)
  
  cfm:
    lambda_start: 1.0                                # CFM não tem warmup. É a base do gradiente o tempo todo.
    lambda_end: 1.0
    e0: 0
    k: 1.0
    
  multi_resolution_stft:
    lambda_start: 0.0
    lambda_end: 0.1                                  # Reduzido agressivamente de 1.0 para 0.1 ("Sussurro", não "grito")
    e0: 10                                           # O centro da sigmoide ocorre na época 10
    k: 0.1                                           # Reduzido de 0.5 para 0.1 (Achata a curva, a subida levará várias épocas)
    fft_sizes: [256, 512, 1024]
    hop_sizes: [64, 128, 256]
    win_sizes: [256, 512, 1024]
    
  compressed_complex:
    lambda_start: 0.0
    lambda_end: 0.05                                 # Reduzido de 0.5 para 0.05 (Fase é sensível, peso deve ser mínimo)
    e0: 12                                           # Começa a rampa levemente depois da MR-STFT para não somar impactos
    k: 0.1                                           # Rampa suave de ativação
    compression: 0.3

# ── Training ─────────────────────────────────
training:
  max_epochs: 200
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  lr_scheduler: cosine_with_warmup
  lr_min: 1.0e-6
  warmup_steps: 1000
  lr_patience: 10
  lr_factor: 0.5
  gradient_clip_val: 5.0
  accumulate_grad_batches: 1
  precision: "bf16-mixed"
  ema_decay: 0.999
  early_stopping_patience: 60
  early_stopping_metric: val_loss/cfm

# ── Validation & Metrics ─────────────────────
validation:
  every_n_steps: 0.25
  audio_log_samples: 4

# ── Test ─────────────────────────────────────
test:
  save_audio_ratio: 0.05
  save_dir: test_results/samples

# ── Inference (OLA) ──────────────────────────
inference:
  chunk_size: 32000                                  # Samples per chunk (= segment_length)
  overlap: 0.5                                       # 50% overlap → Hann COLA
  max_batch_chunks: 16                               # Max chunks per GPU batch

# ── Checkpoints & Logging ────────────────────
checkpoint:
  dirpath: checkpoints
  monitor: val_loss/cfm
  mode: min
  save_top_k: 3
  save_last: true

metrics:
  SI_SDR: true
  ESTOI: true
  PESQ: true
  DNSMOS: true

logging:
  log_dir: tb_logs
  name: cfm-se
