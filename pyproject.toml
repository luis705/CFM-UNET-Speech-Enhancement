[project]
name = "src"
version = "0.1.0"
description = "Conditional Flow Matching for Speech Enhancement"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "pytorch-lightning>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "torchmetrics[audio]>=1.2",
    "torchdiffeq>=0.2",
    "datasets>=3.0",
    "soundfile>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "wvmos>=0.3",
    "pesq>=0.0.4",
    "pystoi>=0.4",
    "torchcodec>=0.11.0",
    "speechmos>=0.0.1.1",
    "onnxruntime-gpu>=1.24.3",
    "gputil>=1.4.0",
    "matplotlib>=3.10.8",
    "onnxscript>=0.6.2",
    "torchview>=0.2.7",
    "graphviz>=0.21",
    "einops>=0.8.2",
    "torchinfo>=1.8.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "taskipy>=1.14.1",
    "mypy>=1.19.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.taskipy]
[tool.taskipy.tasks]
format = "ruff format ."
check = "ruff check . --fix"
all = "task format & task check"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # estilo
    "F",    # bugs reais
    "I",    # imports (isort)
    "UP",   # modernização python
    "B",    # armadilhas
    "SIM",  # simplificações
    "C4",   # comprehensions
    "RUF",  # regras do Ruff
]

ignore = [
    "B008",  # Depends() como default (FastAPI)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["app"]

