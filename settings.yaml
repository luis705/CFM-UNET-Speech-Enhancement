dataset:
  hf_repo: 'JacobLinCool/VoiceBank-DEMAND-16k'
  cache_dir: './cache'

data:
  # Data loader
  batch_size: 32
  num_workers: 8

  # Splits
  val_split: 0.1

  # Augmentation
  augment: True
  augment_pct: 0.5


audio:
  sample_rate: 16000
  audio_length_seconds: 2
  # FFT settings
  fft_size: 1024
  hop_length: 256
  window_size: 1024
  # Power law compression settings
  alpha: 0.5


model:
  time_emb_dim: 128
  projection_dim: 24
  n_blocks: 3
  compression_factor: 2
  channels_factor: 2
  num_heads: 4
  ff_mult: 2
  n_groups: 8
  gradient_checkpointing: true

ode:
  val_steps: 1
  test_steps: 5

logging:
  log_dir: logs
  n_audios: 5
  histogram_logging_frequency: 100

evaluation:
  val_slow_metrics_percent: 0.05
  test_slow_metrics_percent: 1.0
  spk_sim_model_id: "microsoft/wavlm-base-plus-sv"
  spk_sim_device: "cpu"
  utmos_hub_repo: "tarepan/SpeechMOS:v1.2.0"
  utmos_model: "utmos22_strong"
  utmos_device: "cpu"

training:
  early_stop_patience: 30
  early_stop_min_epochs: 20
  precision: "bf16-mixed"
  max_epochs: 200
  accum_batches: 1
  grad_clip: 1.0
  validation_slow_metrics_pct: 0.05
  val_interval: 1.0

  # Optimizer
  optim:
    lr: 2e-4
    weight_decay: 1e-5
    pct_start: 0.1

  losses:
    cfm:
      lambda_value: 1.0
      snr_min_val: 5.0

    mrstft:
      fft_sizes: [512, 1024, 2048]
      hop_sizes: [120, 240, 480]
      win_sizes: [512, 1024, 2048]
      lambda_max: 0.05
      start_epoch: 2
      end_epoch: 20

test:
  save_dir: "test_results/samples"
  # Number of test samples saved with clean/noisy audio and every ODE step
  trajectory_n_audios: 5